name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Typecheck
        # Covers the root-level entry points `tsconfig.json`'s `include: [src]`
        # has never reached. Without it no gate in this repo checks a single
        # TypeScript claim about `monitor.ts`: eslint is scoped to `^src/`,
        # rollup's entry never imports it, and ts-jest runs `isolatedModules`.
        run: npm run typecheck
      - name: Prettier
        run: npx prettier --check './src/**/*.{js,jsx,ts,tsx}' './__tests__/**/*.{js,jsx,ts,tsx}' './*.ts'
  test:
    runs-on: ubuntu-latest
    # Dates below are read off `nodejs/Release`'s `schedule.json`, fetched
    # 2026-10-14, not off memory. That provenance is the point: the previous
    # version of this comment justified a leg with "plexpi runs 25", which was
    # false, and the replacement justified keeping 25 as "forward-looking",
    # which was also false -- 25 reached end-of-life 2026-06-01. Cite the
    # schedule so the next reader can re-derive instead of re-trusting.
    #
    #   v20  lts 2023-10-24  maint 2024-10-22  END 2026-04-30
    #   v24  lts 2025-10-28  maint 2026-10-20  END 2028-04-30
    #   v25  (no lts line)   maint 2026-04-01  END 2026-06-01
    #   v26  lts 2026-10-28  maint 2027-10-20  END 2029-04-30
    #
    # 24 is the interpreter production executes: it is what `Dockerfile`'s
    # `ARG NODE_IMAGE` pins as of issue #44, supported to 2028-04-30. That
    # coupling is enforced by `__tests__/node-matrix-gate.spec.ts`, which reads
    # the major off the Dockerfile rather than restating it here -- bump the
    # base image without a matching leg and the suite goes red.
    #
    # 26 is the second leg, and it is the only one that can warn BEFORE a bump:
    # it is the Current line (since 2026-05-05) and becomes Active LTS
    # 2026-10-28, so it is where this pin goes next. Measured green before it
    # was added -- 194/194 on v26.11.1 in a clean clone -- rather than assumed
    # from the fact that a leg exists. The gate can only check that a leg is
    # PRESENT; whether the suite passes on it is the leg's own job.
    #
    # 20 AND 25 ARE BOTH GONE, and what they bought went before them. These
    # legs were added for the Canadian transport fork, which picked `got` below
    # node 21 and undici's `fetch` at or above, so a pair either side of 21
    # graded a production DEFAULT that was sensitive to the running major.
    # Issue #32 deleted that region; nothing in the suite reads the running
    # major now, so the legs run byte-identical assertions and differ only in
    # interpreter. Both of the dropped majors were past end-of-life, 25 by four
    # months longer than 20 -- which is why "drop the EOL leg" could not stop
    # at 20. Whether two legs is the right number at all is issue #31.
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm test
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
