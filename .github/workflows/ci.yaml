name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Typecheck
        # Covers the root-level entry points `tsconfig.json`'s `include: [src]`
        # has never reached. Without it no gate in this repo checks a single
        # TypeScript claim about `monitor.ts`: eslint is scoped to `^src/`,
        # rollup's entry never imports it, and ts-jest runs `isolatedModules`.
        run: npm run typecheck
      - name: Prettier
        run: npx prettier --check './src/**/*.{js,jsx,ts,tsx}' './__tests__/**/*.{js,jsx,ts,tsx}' './*.ts'
  test:
    runs-on: ubuntu-latest
    # 20 because that is what `Dockerfile`'s `ARG NODE_IMAGE` pins, so this is
    # the interpreter plexpi actually executes; 24 and 25 for interpreter-level
    # drift above it (#26 was a TLS regression WITHIN one transport arm, so
    # drift is the failure this repo has actually had). The 20 leg is pinned to
    # the image by `__tests__/node-matrix-gate.spec.ts`, derived from the
    # Dockerfile -- bump the base image without adding its major here and the
    # suite goes red.
    #
    # WHAT THIS NO LONGER BUYS, because it used to and the comment outlived it.
    # These legs were added for the Canadian transport fork, which picked `got`
    # below Node 21 and undici's `fetch` at or above, so the pair graded a
    # version-sensitive production DEFAULT. Issue #32 deleted that region. No
    # assertion in the suite is version-sensitive now -- the legs run
    # byte-identical tests on three interpreters. Whether that is worth three
    # legs is issue #31, not something this comment should decide.
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 24, 25]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm test
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
