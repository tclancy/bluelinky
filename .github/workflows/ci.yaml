name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Typecheck
        # Covers the root-level entry points `tsconfig.json`'s `include: [src]`
        # has never reached. Without it no gate in this repo checks a single
        # TypeScript claim about `monitor.ts`: eslint is scoped to `^src/`,
        # rollup's entry never imports it, and ts-jest runs `isolatedModules`.
        run: npm run typecheck
      - name: Prettier
        run: npx prettier --check './src/**/*.{js,jsx,ts,tsx}' './__tests__/**/*.{js,jsx,ts,tsx}' './*.ts'
  test:
    runs-on: ubuntu-latest
    # Two legs, one either side of the major-21 threshold, because the Canadian
    # region has two production transports and the threshold is what selects
    # between them: `got` below 21, undici's `fetch` at or above it. A single
    # leg grades one arm and leaves the other merely reachable.
    #
    # Measured on 2026-10-12 against this branch, hard-wiring
    # `useFetchTransport` past `shouldUseFetchTransport()`:
    #
    #   = true   node 20 RED   node 24 green
    #   = false  node 20 green node 24 RED
    #
    # The second row is why this is not cosmetic: node 20 alone -- what CI ran
    # before this change -- is blind to the mutant that disables the arm that
    # actually executes on plexpi.
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm test
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
