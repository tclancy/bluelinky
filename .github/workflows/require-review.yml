name: Require Code Review

# Issue #35, option (a), second half. The first half (`claude-code-review.yml`)
# PRODUCES a review; this publishes a commit status saying whether one exists
# for the CURRENT head, so a PR that has not been reviewed reads red instead of
# reading exactly like a reviewed one.
#
# WHY A COMMIT STATUS AND NOT THIS JOB'S OWN CHECK. A check-run attaches to the
# SHA of the event that triggered it. An `issue_comment` run executes in the
# default-branch context, so its implicit check lands on `main`'s tip and never
# touches the PR head -- which is the whole mechanism behind metaframework#620.
# Posting to `repos/.../statuses/<head sha>` targets the PR head from either
# trigger. This job therefore always succeeds; the verdict is the status.
#
# WHY NOT VENDOR metaframework's `review_gate.py`. It is 668 lines and lives in
# a PRIVATE repo, so a public repo's `github.token` cannot read it cross-repo
# and `actions/checkout` with no `repository:` would look for
# `bluelinky/src/dispatch/review_gate.py` and find nothing. Its extra
# sophistication (errored-run checklists, docs-only skip, round counting) is
# tuning for that repo's own history. The decision here is `.github/review-gate.jq`
# -- a pure jq function, unit-tested by `__tests__/review-gate.spec.ts`, with
# `jq` and `gh` both preinstalled on `ubuntu-latest`, so this job needs no
# checkout of `node_modules`, no `npm ci` and no language runtime.
#
# NOT A MERGE BLOCK. `main` has no branch protection and no rulesets (measured
# 2026-10-23), so this status blocks nothing. The red X is backpressure for
# autonomous agents, which is what #35 asked for.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    # `edited` as well as `created`, and that is a consequence of the gate's
    # own rule rather than a nicety. `.github/review-gate.jq` only counts a bot
    # comment once its progress checklist has no outstanding `- [ ]` items, and
    # `track_progress: true` posts that checklist unticked and EDITS it to
    # completion in place. On `created` alone the gate could never observe the
    # boxes get ticked. The cost is one run per edit during a live review; they
    # are ~15s, and this repo is public, where Actions minutes are free.
    types: [created, edited]
  # A formal APPROVED / CHANGES_REQUESTED satisfies the gate -- it is how Tom
  # satisfies it himself -- but it arrives as `pull_request_review`, not as an
  # `issue_comment`. Without this, approving a PR yourself left the red X
  # sitting there (metaframework had the same bug).
  pull_request_review:
    types: [submitted]

concurrency:
  group: require-review-${{ github.event.pull_request.number || github.event.issue.number }}
  # MUST stay false. GitHub paints a *cancelled* run red on the PR even when
  # the authoritative status this workflow publishes is green, which is what
  # made three metaframework PRs read UNSTABLE with every real check passing
  # (metaframework#511). The concurrency group still serialises, so two runs
  # never race to write the same commit status, and a run still pending when a
  # newer one queues is dropped -- which is what bounds the `edited` burst.
  cancel-in-progress: false

jobs:
  require-review:
    # For `issue_comment`, only run when the comment could change the answer:
    # the review bot posting or ticking its own comment (the self-heal path), or
    # anyone asking for `/review`. Ordinary human discussion is skipped.
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
       (github.event.comment.user.login == 'claude[bot]' ||
        contains(github.event.comment.body, '/review')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
      statuses: write
    steps:
      # Only the one file. No `npm ci`, no `setup-node`: the gate is a jq
      # program and `ubuntu-latest` ships jq and gh already.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/review-gate.jq
          sparse-checkout-cone-mode: false

      - name: Resolve PR number and head SHA
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # `issue_comment` carries no pull_request object, so the head SHA has
          # to be looked up. `pull_request` and `pull_request_review` both have
          # it.
          #
          # Every value arrives through `env:` above rather than being
          # interpolated into this script by a GitHub expression. A PR title or
          # comment body spliced straight into shell is a command-injection
          # surface, and one of the fields read here IS the PR title.
          #
          # And an expression in a `run:` body is not inert even in a COMMENT:
          # GitHub evaluates them before the shell ever sees the script, so a
          # commented-out one is still parsed. An earlier draft of this
          # paragraph spelled the token out with an empty expression inside it,
          # which is not a valid expression -- and that made the whole workflow
          # file invalid.
          #
          # The tell was a `push` run -- an event this workflow has no trigger
          # for -- that FAILED with zero jobs, no annotation and no log; `gh run
          # view` says only "This run likely failed because of a workflow file
          # issue". `check-yaml`, `prettier` and `@action-validator/cli` all
          # passed the file, including against a known-good control.
          #
          # What is NOT a tell, though it looks like one: this workflow appears
          # in `gh api actions/workflows` under its PATH rather than its
          # `name:`. That is just what GitHub shows for a workflow absent from
          # the DEFAULT branch -- the run that succeeded after the fix displays
          # the same way. Read the zero-jobs failure, not the name.
          #
          # Bisected on 2026-10-23 by pushing five cumulative probe files in one
          # commit. `__tests__/review-gate.spec.ts` now bans the token from
          # every `run:` block in both workflows, which is the same rule the
          # paragraph above asks for anyway.
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            number="$ISSUE_NUMBER"
            sha="$(gh api "repos/${REPO}/pulls/${number}" --jq .head.sha)"
          else
            number="$PR_NUMBER"
            sha="$PR_HEAD_SHA"
          fi
          echo "number=${number}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      # A cross-repository PR's `GITHUB_TOKEN` is read-only, so `statuses:
      # write` above is not granted and the POST below would 403 -- turning
      # every outside contribution into a red *workflow* run, which is worse
      # than no gate. The reviewer skips the same PRs for the matching reason
      # (it cannot post inline comments either). Outside contributions get
      # Tom's own review; this gate is backpressure on agent PRs.
      #
      # THE DISCRIMINATOR IS `head.repo.full_name`, NOT `head.repo.fork`. See
      # the long note on the same `if:` in `claude-code-review.yml`: this repo
      # IS a fork, so `head.repo.fork` is `true` for every same-repo branch in
      # it, and keying on it skips 100% of this repo's PRs while looking right.
      - name: Is this a cross-repository PR?
        id: fork
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            head_repo="$HEAD_REPO"
          else
            head_repo="$(gh api "repos/${REPO}/pulls/${NUMBER}" --jq '.head.repo.full_name')"
          fi
          # Default to "yes, cross-repo" when the head repo cannot be read at
          # all: a DELETED head repo reports `null`, and skipping is the safe
          # direction (no status is better than a 403-failed job).
          if [ "$head_repo" = "$REPO" ]; then
            fork=false
          else
            fork=true
          fi
          echo "fork=${fork}" >> "$GITHUB_OUTPUT"
          # An `if`, not `[ ... ] && echo`: under `set -e` a false test makes
          # the whole AND-list exit 1 and takes the step down with it, so the
          # same-repo case -- the common one -- would fail the job.
          if [ "$fork" = "true" ]; then
            echo "::notice::Cross-repository PR (head ${head_repo}) - review gate skipped; its token cannot write a commit status."
          fi

      - name: Evaluate the gate and publish the status to the PR head
        if: steps.fork.outputs.fork != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ steps.pr.outputs.number }}
          SHA: ${{ steps.pr.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Layer 0 (see the `claude-code-action-review-gate` skill): an UNSET
          # secret interpolates to the empty string, so this is how the gate
          # learns the reviewer cannot run at all. Measured 2026-10-23: this
          # repo has no Actions secrets, so until Tom adds one the gate would
          # otherwise be a permanent red X with no remedy available to anyone
          # but him -- exactly the workload transfer option (a) was chosen to
          # avoid. `pending` instead: visibly not-green, not a false pass, and
          # it names the owner and the remedy.
          #
          # THIS CHECK NOW SITS AFTER THE GATE RATHER THAN BEFORE IT. See the
          # note at its new site below -- the order is a bug fix, not tidying.
          REVIEWER_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail

          publish() {
            gh api -X POST "repos/${REPO}/statuses/${SHA}" \
              -f state="$1" \
              -f context="dispatch/require-review" \
              -f description="$2" \
              -f target_url="${RUN_URL}" >/dev/null
            printf 'dispatch/require-review = %s: %s\n' "$1" "$2"
          }

          # Publish `error` rather than nothing if anything below blows up.
          # Without this the step just dies under `set -e` and NO status is
          # posted -- so the PR silently keeps whatever status it already had,
          # which on a re-evaluation of an approved-then-pushed PR is a stale
          # GREEN. A gate's failure mode must not be "leave the last verdict
          # standing". `trap` fires on the non-zero exit; `publish` is defined
          # above it, and the `|| true` keeps a failing publish from recursing.
          trap 'publish error "Gate could not be evaluated - see the run log. This is a gate failure, not a review verdict." || true' ERR

          # `--paginate` without `--jq` emits one JSON array PER PAGE, which is
          # not a single document. `--jq '.[]'` streams the objects and `jq -s`
          # reassembles them into one array, so this is page-count-independent.
          gh api "repos/${REPO}/issues/${NUMBER}/comments" --paginate --jq '.[]' | jq -s '.' > comments.json
          gh api "repos/${REPO}/pulls/${NUMBER}/reviews"   --paginate --jq '.[]' | jq -s '.' > reviews.json
          gh api "repos/${REPO}/pulls/${NUMBER}" > pr.json
          gh api "repos/${REPO}/commits/${SHA}" > head.json

          # `--slurpfile`, not `--argjson "$(cat ...)"`: a PR body or a review
          # comment can be long, and routing the whole document through argv
          # puts it under ARG_MAX and through another layer of shell quoting
          # for no gain. Each `$name` is an ARRAY of the file's documents,
          # hence `[0]`.
          jq -n \
            --slurpfile pr       pr.json \
            --slurpfile head     head.json \
            --slurpfile comments comments.json \
            --slurpfile reviews  reviews.json \
            '{ number: $pr[0].number,
               author: $pr[0].user.login,
               title:  $pr[0].title,
               # The committer date of the HEAD commit. `review_gate.py` instead
               # takes `max()` over every commit in `pulls/N/commits`, to
               # drop the assumption that the head is the newest -- so this is
               # NOT parity with it, and the difference is real if a push
               # lands commits out of date order (rebase, cherry-pick). The
               # trade is deliberate: `commits/{SHA}` is exact for the SHA the
               # status is posted to and has no 250-commit page cap, where the
               # list endpoint has both. If a reviewed-then-reordered PR ever
               # reads fresh here, this line is why.
               head_committed_at: $head[0].commit.committer.date,
               bot_logins: ["claude[bot]"],
               # The FORMAL-REVIEW arm is allow-listed separately, and the two
               # lists answer different questions -- see the long note on
               # `candidates` in `.github/review-gate.jq`. This repo is public,
               # so without this any GitHub account could turn the status
               # green by submitting a review, and one fleet bot could clear a
               # PR opened by another.
               #
               # NOTE FOR THE NEXT EDITOR OF THIS COMMENT: these lines sit
               # INSIDE the single-quoted jq program below, so an APOSTROPHE
               # here closes that quote and leaves the rest of the step as one
               # unterminated string -- a workflow that YAML parses and bash
               # cannot. The draft of this very comment used a possessive and
               # broke the block; the `every workflow run: block is valid
               # shell` test caught it, which is what that test is for.
               reviewer_logins: ["tclancy"],
               comments: $comments[0],
               reviews: $reviews[0] }' > gate-input.json

          verdict="$(jq -f .github/review-gate.jq gate-input.json)"
          state="$(printf '%s' "$verdict" | jq -r .state)"
          description="$(printf '%s' "$verdict" | jq -r .description)"

          # THE UNPROVISIONED CHECK RUNS *AFTER* THE GATE, AND THE ORDER IS THE
          # WHOLE POINT. It used to be the first thing in this step, which meant
          # an empty `CLAUDE_CODE_OAUTH_TOKEN` short-circuited before
          # `exempt_reason` in `review-gate.jq` was ever evaluated.
          #
          # That is not hypothetical, and it bites hardest once Tom adds the
          # secret. **Dependabot runs read a SEPARATE secret store** (Settings
          # -> Secrets and variables -> Dependabot), so
          # `secrets.CLAUDE_CODE_OAUTH_TOKEN` interpolates EMPTY on a Dependabot
          # `pull_request` event even when the Actions secret exists. Under the
          # old order every Dependabot PR in this repo would publish `pending`
          # with a description instructing Tom to add a secret that is already
          # there -- instead of the `success` that `exempt_reason` grants it.
          # Found in the bot review of parsons-remote#26 and fixed in both
          # copies. GENERAL RULE: an exemption must never sit downstream of a
          # provisioning check.
          #
          # Ordering it this way also keeps ONE source of truth for the
          # exemption. The obvious alternative -- test the author in shell,
          # before the token check -- puts `dependabot[bot]` in both this file
          # and `review-gate.jq`, which is the drift the
          # `the author exemptions agree between the two files` test exists to
          # prevent.
          if [ "$state" != "success" ] && [ -z "${REVIEWER_TOKEN}" ]; then
            publish pending \
              "Not provisioned for this event: no CLAUDE_CODE_OAUTH_TOKEN visible, so the reviewer cannot run. Dependabot uses a separate secret store."
            exit 0
          fi

          publish "$state" "$description"

      # The ERR trap above only covers the step it is declared in. If
      # `Resolve PR number and head SHA` or `Is this a cross-repository PR?`
      # dies first -- a transient 5xx or a secondary rate limit on `gh api` is
      # enough -- then nothing publishes, and the PR silently keeps whatever
      # `dispatch/require-review` it already had. On a re-evaluation of an
      # approved-then-pushed PR that is a stale GREEN: the exact failure mode
      # the trap exists to prevent, arriving one step earlier than the trap can
      # see it.
      #
      # `if: failure()` so it runs only when something above failed, and it
      # re-resolves the SHA itself rather than trusting `steps.pr.outputs` --
      # which is empty precisely when the resolve step is what broke. If the SHA
      # cannot be recovered at all there is nowhere to post, and saying so in
      # the log is all that is left.
      - name: A failure anywhere above must not leave a stale verdict standing
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            number="$ISSUE_NUMBER"
          else
            number="$PR_NUMBER"
            sha="$PR_HEAD_SHA"
          fi
          if [ -z "${sha:-}" ]; then
            sha="$(gh api "repos/${REPO}/pulls/${number}" --jq .head.sha || true)"
          fi
          if [ -z "${sha:-}" ]; then
            echo "::warning::Could not resolve a head SHA, so no status could be published."
            exit 0
          fi
          gh api -X POST "repos/${REPO}/statuses/${sha}" \
            -f state=error \
            -f context="dispatch/require-review" \
            -f description="Gate failed before it could evaluate - see the run log. Not a review verdict." \
            -f target_url="${RUN_URL}" >/dev/null || true
