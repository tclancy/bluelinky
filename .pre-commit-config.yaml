# pre-commit's `default_stages` defaults to EVERY stage, so every hook below is
# already declared as a pre-push hook. But `default_install_hook_types` defaults
# to `pre-commit` ALONE, so `pre-commit install` arms only the commit path and
# the declared pre-push battery never runs. Declaring both is the half that
# survives a fresh clone; running `pre-commit install` is the half that is local
# machine state, and it must be re-run by anyone who installed before this line
# existed. See #12.
#
# The pre-push battery is every hook below, so do not add `default_stages` or a
# per-hook `stages:` that excludes `pre-push` without meaning it — a test fails
# if you do.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        # TypeScript's config format is JSONC -- `tsc -p` accepts `//` comments
        # and `tsconfig.typecheck.json` uses them to record why its `include` is
        # narrow. `check-json` is a strict-JSON validator and rejects them.
        # Nothing is lost: `npm run typecheck` and `npm run build` both parse
        # these files with TypeScript's own reader, which is a stricter check of
        # the thing that matters than a syntax pass would be.
        exclude: ^tsconfig.*\.json$
      - id: check-merge-conflict
  - repo: local
    hooks:
      - id: eslint
        name: ESLint
        language: system
        entry: npx eslint --ext .js,.jsx,.ts,.tsx
        files: ^src/
        types_or: [javascript, jsx, ts, tsx]
        pass_filenames: true
      - id: typecheck
        name: Typecheck (tsc)
        language: system
        # pass_filenames: false -- tsc takes a project, and a type error in one
        # file is usually introduced by an edit to another. Passing only the
        # staged paths would make the gate miss exactly that case.
        entry: npx tsc -p tsconfig.typecheck.json
        pass_filenames: false
        files: \.ts$
      - id: prettier
        name: Prettier
        language: system
        entry: npx prettier --check
        types_or: [javascript, jsx, ts, tsx, json, yaml, markdown]
        exclude: ^(package-lock\.json|node_modules/|dist/|dist-types/)
        pass_filenames: true
